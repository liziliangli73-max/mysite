# 每日一句：每天挑一句更新到网站
name: 每日一句

on:
  schedule:
    - cron: '0 1 * * *'      # UTC 01:00 = 北京 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 挑今天的句子
        run: python pick_quote.py

      - name: 提交
        run: |
          git config user.name "句子机器人"
          git config user.email "bot@users.noreply.github.com"
          git add daily/quote.json
          if git diff --staged --quiet; then
            echo "今天的句子没变"
          else
            git commit -m "每日一句 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
